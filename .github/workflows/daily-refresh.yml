name: Daily refresh

on:
  schedule:
    - cron: '30 21 * * *'   # 03:00 IST every day
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to commit the updated jobs.db

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # node:sqlite needs Node 22.5+

      - run: npm ci --omit=dev

      - name: Fetch, dedupe and tag new posts
        run: npm run refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_MAX_CALLS: 3

      - name: Commit updated database
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add jobs.db
          git diff --staged --quiet || (git commit -m "Daily refresh $(date -u +%F)" && git push)